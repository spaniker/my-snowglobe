<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>my snowglobe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hero">
        <h1>My snowglobe!</h1>
        <p>Shake it for a cozy winter message</p>
    </header>
    <main>
        <section class="globe-card">
            <div class="globe" id="globe">
                <img class="scene" src="snowglobe.png" alt="image of a snowglobe" />
              </div>
              <button id="shake">Shake the globe!</button>
              <p class="message" id="message">press the button and see what settles</p>
        </section>
    </main>
    <footer>
        <p>Made by Syona, in the snow</p>
    </footer>
    <script src="script.js">

       

    </script>
  </body>
</html>
