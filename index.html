<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>my snowglobe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hero">
        <h1>Lukes Coffeeshop</h1>
        <p class="tagline"> Shake it for a Gilmore Girl's Quote!</p>
    </header>
    <main>
      <section class="scene">
        <img class="leaf"id="leftLeaf" src="fallLeaf.png">
          <section class="globe-card">
              
                <button id="shake">
                  <div class="globe" id="globe">
                    <img class="cup" src="lukesLogo.png" alt="image of a snowglobe" />
                  </div>
                </button>
                <p class="message" id="message">Press the image and see what happens!</p>
          </section>
          <img class="leaf"id="rightLeaf" src="fallLeaf.png">
      </section>
    </main>
    <footer>
        <p>Made by Syona, in Stars Hollow</p>
    </footer>
    <script src="script.js">

       

    </script>
  </body>
</html>
